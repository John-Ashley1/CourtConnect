spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/courtconnect?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# change JWT_SECRET in production (32+ characters)
jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123}
jwt.expiration-ms=86400000
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
server.error.include-message=always
