# Loads local secrets from backend/.env when it exists (git ignores that file)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.exhfvhnjnvncbnfozswq}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# change JWT_SECRET in production (32+ characters)
jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123}
jwt.expiration-ms=86400000
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
server.error.include-message=always
# First system admin, created on startup if missing. Set ADMIN_EMAIL / ADMIN_PASSWORD as environment variables only.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_NAME:System Administrator}
