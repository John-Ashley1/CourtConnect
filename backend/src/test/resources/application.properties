# Tests run against an in-memory H2 database in PostgreSQL mode, never against Supabase.
spring.datasource.url=jdbc:h2:mem:cc-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
jwt.secret=test-secret-test-secret-test-secret-1234567890
jwt.expiration-ms=3600000
app.cors-origin=http://localhost:5173
app.frontend-url=http://localhost:5173
spring.mail.host=
app.mail.from=
app.bootstrap-admin.email=
app.bootstrap-admin.password=
app.bootstrap-admin.name=System Administrator
server.error.include-message=always
app.timezone=Asia/Manila
app.slots.days-ahead=14
# The scheduled job is effectively off; tests call BookingExpiry.run() themselves.
app.bookings.expiry-check-ms=86400000
app.paymongo.secret-key=
app.paymongo.webhook-secret=
