# Loads local secrets from backend/.env when it exists (git ignores that file)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.exhfvhnjnvncbnfozswq}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# change JWT_SECRET in production (32+ characters)
jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-key-123}
jwt.expiration-ms=86400000
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
# Where "forgot password" links point (the frontend)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# Password reset email (optional). Leave MAIL_HOST unset to print reset links in this console instead.
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<16-char App Password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
server.error.include-message=always
# First system admin, created on startup if missing. Set ADMIN_EMAIL / ADMIN_PASSWORD as environment variables only.
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.name=${ADMIN_NAME:System Administrator}
